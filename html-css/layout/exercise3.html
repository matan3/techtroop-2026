<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" type="text/css" href="style3.css">
    <title>Exercise 3</title>
</head>

<body>
    <div class="form-container">
        <form action="#" method="post">

            <h2 class="title">Contact Form</h2>
            <p class="description">Get in touch with us</p>

            <div class="row">
                <div class="field">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" required>
                </div>
                <div class="field">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>
            </div>

            <div class="field">
                <label for="email-address">Email Address</label>
                <input type="email" id="email-address" name="email-address" required>
            </div>

            <div class="row">
                <div class="field">
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject">
                        <option value="">Select a topic</option>
                        <option value="general">general</option>
                        <option value="support">support</option>
                        <option value="sales">sales</option>
                    </select>
                </div>
                <div class="field">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Tell us how we can help..."
                    required></textarea>
            </div>

            <div class="field">
                <label class="field-title">Contact Preferences</label>
                <div class="checkbox-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="updates">
                        <label for="terms">Email Updates</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="phone-follow-up" name="updates">
                        <label for="phone-follow-up">Phone Follow-up</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="updates">
                        <label for="newsletter">Newsletter</label>
                    </div>
                </div>
            </div>

            <div class="button-container">
                <button type="button" class="button button-save">Save Draft</button>
                <button type="submit" class="button button-send">Send Message</button>
            </div>
        </form>
    </div>
</body>


</html>
