<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Exercise 5</title>
</head>

<body>
    <h1>Contact US</h1>

    <fieldset>
        <legend>
            Personal Information
        </legend>

        <div style="margin-bottom: 15px;">
            <label>Name:</label>
            <input type="text" placeholder="your name">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Email:</label>
            <input type="email" placeholder="you@email.com">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Phone:</label>
            <input type="tel" placeholder="(555) 123-4567">
        </div>
    </fieldset>

    <fieldset>
        <legend>
            Message details
        </legend>

        <div style="margin-bottom: 15px;">
            <label>Subject:</label>
            <select>
                <option value="Option 1">Option 1</option>
                <option value="Option 2">Option 2</option>
                <option value="Option 3">Option 3</option>
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label>Priority:</label>
            <label><input type="radio" name="Low" value="Low" checked>Low</label>
            <label><input type="radio" name="Medion" value="Medion"> Medion</label>
            <label><input type="radio" name="High" value="High"> High</label>
        </div>

        <div>
            <label>Message</label>
            <textarea name="Message" rows="4" placeholder="Your message..." style="width: 100%;"></textarea>
        </div>

    </fieldset>

    <fieldset>
        <legend>
            Preferences
        </legend>

        <div style="margin-bottom: 15px;">
            <label><input type="checkbox" name="Subscribe" value="tech">Subscribe</label>
        </div>

        <div style="margin-bottom: 15px;">
            <label>Contact method:</label>
            <select>
                <option value="Email">Email</option>
                <option value="Phone">Phone</option>
            </select>
        </div>
    </fieldset>

    <div style="margin-bottom: 15px;">
        <button type="submit">submit</button>
        <button type="reset">Reset</button>
    </div>

</body>

</html>
