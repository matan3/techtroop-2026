<!DOCTYPE html>
<html lang="he">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUPG - Random User Page Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <main class="main-content">
            <section id="main-user-container" class="user-header">
            </section>

            <div id="error-message" class="hidden"></div>

            <section class="quote-section">
                <p class="section-label">Favorite quote:</p>
                <div id="quote-container">
                </div>
            </section>

            <section id="pokemon-container" class="pokemon-section">
            </section>

            <section class="about-section">
                <p class="section-label">About me</p>
                <p id="about-me-text"></p>
            </section>

            <footer class="controls">
                <button id="generate-btn">Generate User</button>
                <button id="save-btn">Save User Page</button>
                <select id="saved-users-dropdown">
                    <option value="">-- Select Saved User --</option>
                </select>
                <button id="load-btn">Load User Page</button>
            </footer>

        </main>

        <aside class="friends-sidebar">
            <h3>Friends</h3>
            <ul id="friends-list">
            </ul>
        </aside>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
