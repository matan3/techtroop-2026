<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Auto Complete Trie</title>
</head>

<body>
    <div class="container">
        <div class="addSection">
            <input type="text" id="wordInput" placeholder="Enter a word to add to dictionary">
            <button id="btnAdd">Add Word</button>
        </div>
        <div class="suggestionSection">
            <input type="text" id="wordSuggestions" placeholder="Start typing to see suggestions...">
            <div id="output"></div>
        </div>
        <div id="output"></div>
        <div id="wordCountDisplay"></div>
    </div>
    <script type="module" src="./main.js"></script>
</body>

</html>
